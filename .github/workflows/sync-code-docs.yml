name: Sync Code Docs

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE_SYNC_URL: ${{ secrets.DOCS_SITE_SYNC_URL || 'http://103.105.233.156/api/github/docs-sync/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build changed files payload
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-status -r "$AFTER" > changed_files.txt || true
          else
            git diff --name-status --find-renames "$BEFORE" "$AFTER" > changed_files.txt || true
          fi

          echo "Changed files:"
          cat changed_files.txt || true

          python3 <<'PY'
          import json
          from pathlib import Path

          MAX_FILE_SIZE = 200000

          ALLOWED_EXTENSIONS = {
              ".cs",
              ".xaml",
              ".xml",
              ".json",
              ".sql",
              ".md",
              ".py",
              ".js",
              ".ts",
              ".html",
              ".css",
              ".csproj",
              ".sln",
              ".config",
              ".yml",
              ".yaml",
          }

          IGNORED_PARTS = {
              "/bin/",
              "/obj/",
              "/.git/",
              "/node_modules/",
              "/packages/",
              "/dist/",
              "/build/",
              "/.vs/",
          }

          def should_process_file(file_path: str) -> bool:
              normalized = "/" + file_path.replace("\\", "/").lower()
              if any(part in normalized for part in IGNORED_PARTS):
                  return False
              suffix = Path(file_path).suffix.lower()
              return suffix in ALLOWED_EXTENSIONS

          def is_probably_text(path: Path) -> bool:
              try:
                  raw = path.read_bytes()[:2048]
              except Exception:
                  return False
              if b"\x00" in raw:
                  return False
              try:
                  raw.decode("utf-8")
                  return True
              except UnicodeDecodeError:
                  return False

          def read_file_content(file_path: str):
              path = Path(file_path)
              if not path.exists() or not path.is_file():
                  return None
              if path.stat().st_size > MAX_FILE_SIZE:
                  return None
              if not is_probably_text(path):
                  return None
              return path.read_text(encoding="utf-8", errors="replace")

          changes = []

          with open("changed_files.txt", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue

                  parts = line.split("\t")
                  status_raw = parts[0]
                  status = status_raw[0]

                  if status == "R" and len(parts) >= 3:
                      old_path = parts[1]
                      file_path = parts[2]
                  elif len(parts) >= 2:
                      old_path = ""
                      file_path = parts[1]
                  else:
                      continue

                  if not should_process_file(file_path):
                      continue

                  file_content = None
                  if status != "D":
                      file_content = read_file_content(file_path)

                  changes.append({
                      "status": status,
                      "status_raw": status_raw,
                      "old_path": old_path,
                      "file_path": file_path,
                      "file_content": file_content,
                  })

          payload = {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "changes": changes,
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
          PY

      - name: Send payload to doc server
        env:
          DOCS_SYNC_SECRET: ${{ secrets.DOCS_SYNC_SECRET }}
        run: |
          if [ -z "$DOCS_SITE_SYNC_URL" ]; then
            echo "DOCS_SITE_SYNC_URL is not set." >&2
            exit 1
          fi

          if [ -z "$DOCS_SYNC_SECRET" ]; then
            echo "DOCS_SYNC_SECRET is not set." >&2
            exit 1
          fi

          response_file="response.txt"
          curl_exit=0
          http_status="$(curl -sS --connect-timeout 15 --max-time 60 -o "$response_file" -w "%{http_code}" -X POST "$DOCS_SITE_SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "X-Docs-Secret: $DOCS_SYNC_SECRET" \
            --data-binary @payload.json)" || curl_exit=$?

          echo "curl exit code: $curl_exit"
          echo "HTTP status: $http_status"
          echo "Response body:"
          cat "$response_file" || true

          if [ "$curl_exit" -ne 0 ]; then
            exit "$curl_exit"
          fi

          if [ "${http_status#2}" = "$http_status" ]; then
            exit 1
          fi
